# ============================================
# InCTF 2026 Finals — tmux config
# TEAM_UNFINDABLES
# ============================================

# Remap prefix to Ctrl+a (easier than Ctrl+b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable mouse support
set -g mouse on

# Start window/pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Navigate panes with Alt+arrow (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Resize panes with Shift+arrow
bind -n S-Left resize-pane -L 2
bind -n S-Right resize-pane -R 2
bind -n S-Up resize-pane -U 2
bind -n S-Down resize-pane -D 2

# Quick reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Increase scrollback buffer
set -g history-limit 50000

# Faster escape time
set -sg escape-time 0

# 256 color support
set -g default-terminal "screen-256color"

# Status bar styling
set -g status-style 'bg=#1a1b26 fg=#a9b1d6'
set -g status-left '#[fg=#7aa2f7,bold] CTF #[fg=#565f89]│ #[fg=#9ece6a]#S '
set -g status-right '#[fg=#565f89]│ #[fg=#bb9af7]%H:%M #[fg=#565f89]│ #[fg=#f7768e]FIN-030 '
set -g status-left-length 40
set -g status-right-length 40

# Active window styling
setw -g window-status-current-style 'fg=#7aa2f7 bold'
setw -g window-status-current-format ' #I:#W '
setw -g window-status-style 'fg=#565f89'
setw -g window-status-format ' #I:#W '

# Pane border styling
set -g pane-border-style 'fg=#565f89'
set -g pane-active-border-style 'fg=#7aa2f7'

# CTF quick layouts
# Prefix + P = pwn layout (editor + terminal + gdb)
bind P source-file ~/.tmux/pwn-layout 2>/dev/null \; \
    split-window -h -p 40 \; \
    split-window -v -p 50 \; \
    select-pane -t 1

# Prefix + W = web layout (browser terminal + burp + notes)
bind W split-window -h -p 50 \; \
    split-window -v -p 50 \; \
    select-pane -t 1

# Copy mode with vi bindings
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
